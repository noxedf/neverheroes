<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha | Never Heroes</title>
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/svg+xml" href="images/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/topbar.css">
</head>
<body>
<header id="topbar"></header>

<main class="shell">
  <p class="center" id="carregando">Carregando ficha…</p>

  <section id="tela" hidden>
    <div class="barra">
      <a class="btn mini sec" id="btnVoltar" href="fichas.html">← Fichas</a>
      <span class="salvo" id="salvo" aria-live="polite">Salvo</span>
      <button type="button" class="btn mini danger" id="btnExcluir">Excluir</button>
    </div>
    <p class="dono" id="dono" hidden></p>

    <div class="ficha">
      <div class="ficha-logo">Never Heroes</div>

      <!-- INFORMAÇÕES -->
      <div class="bloco">
        <div class="aba"><i>✦</i>Informações</div>
        <div class="corpo">
          <div class="retrato">
            <div id="retratoBox"></div>
            <div class="ctl">
              <input type="file" id="inRetrato" accept="image/*" aria-label="Retrato do personagem">
              <div><button type="button" class="btn mini sec" id="btnRetratoRm">Remover retrato</button></div>
            </div>
          </div>
          <div class="info">
            <div>
              <label class="l2"><span>Nome</span><input type="text" data-k="info.nome" maxlength="60" placeholder="N/A"></label>
              <label class="l2"><span>Idade</span><input type="text" data-k="info.idade" maxlength="20" placeholder="N/A"></label>
              <label class="l2"><span>Altura</span><input type="text" data-k="info.altura" maxlength="20" placeholder="N/A"></label>
            </div>
            <div>
              <label class="l2"><span><i class="ic">★</i>Fama</span><input type="number" data-k="info.fama" placeholder="0"></label>
              <div class="l2"><span><i class="ic rosa">♥</i>Hp</span>
                <input type="number" data-k="info.hp" placeholder="2d20" aria-label="Hp">
                <button type="button" class="dado" data-roll="2d20" data-alvo="info.hp" title="Rolar 2d20">🎲</button></div>
              <label class="l2"><span><i class="ic verde">$</i>Money</span><input type="number" data-k="info.money" placeholder="00"></label>
              <label class="l2"><span><i class="ic rosa">🧠</i>Sanidade</span><input type="number" data-k="info.sanidade" min="0" max="100" placeholder="100"><b class="suf">%</b></label>
            </div>
          </div>
        </div>
      </div>

      <!-- DOM -->
      <div class="bloco">
        <div class="aba"><i>◎</i>Dom</div>
        <div class="corpo dom">
          <label class="l2"><span>Dom</span><input type="text" data-k="dom.nome" maxlength="80" placeholder="N/A"></label>
          <label class="l2"><span>Categorias</span><input type="text" data-k="dom.categorias" maxlength="120" placeholder="N/A"></label>
          <div class="l2 edom"><span><i class="ic azul">🌀</i>EDOM</span>
            <input type="number" data-k="dom.edom" min="0" aria-label="EDOM atual">
            <b class="suf">/</b>
            <input type="number" data-k="dom.edomMax" min="0" aria-label="EDOM máxima">
          </div>
          <div class="barra-edom" aria-hidden="true"><i id="barEdom"></i></div>
        </div>
      </div>

      <!-- STATUS -->
      <div class="bloco">
        <div class="aba"><i>📈</i>Status</div>
        <div class="corpo status" id="status"></div>
      </div>

      <!-- MOCHILA -->
      <div class="bloco">
        <div class="aba"><i>🎒</i>Mochila</div>
        <em class="espaco" id="espaco">Espaço 00/30</em>
        <div class="corpo"><div class="mochila" id="mochila"></div></div>
      </div>

      <!-- HABILIDADES -->
      <div class="bloco">
        <div class="aba"><i>✦</i>Habilidades</div>
        <div class="corpo">
          <div class="lista-itens" id="habilidades"></div>
          <button type="button" class="btn mini sec" data-add="habilidades">+ Habilidade</button>
        </div>
      </div>

      <!-- PASSIVAS -->
      <div class="bloco">
        <div class="aba"><i>🔒</i>Habilidades passivas</div>
        <div class="corpo">
          <div class="lista-itens" id="passivas"></div>
          <button type="button" class="btn mini sec" data-add="passivas">+ Passiva</button>
        </div>
      </div>

      <!-- APARÊNCIA -->
      <div class="bloco">
        <div class="aba"><i>👤</i>Aparência</div>
        <div class="corpo"><textarea data-k="aparencia" rows="6" maxlength="3000" placeholder="Descreva a aparência do personagem..."></textarea></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="js/ficha.js"></script>
</body>
</html>
