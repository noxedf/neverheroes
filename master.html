<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Mestre | Never Heroes</title>
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/svg+xml" href="images/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/topbar.css">
</head>
<body>
<header id="topbar"></header>

<main class="shell wide">
  <div class="page-head">
    <div class="eyebrow">Mesa</div>
    <h1>Painel do Mestre</h1>
    <p>Todas as fichas dos jogadores, agrupadas por jogador.</p>
  </div>

  <div class="toolbar">
    <input class="grow" type="search" id="busca" placeholder="Buscar por personagem, dom ou jogador…" aria-label="Buscar">
  </div>
  <div id="lista" class="center">Carregando fichas…</div>
</main>

<script type="module">
import { db, guard, renderTopbar, avatarNode, el, fmtData } from "./js/fb.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const { profile } = await guard("master");
renderTopbar(profile, "master", "Painel do Mestre");

const lista = document.getElementById("lista");
let fichas = [], usuarios = {};

function card(f) {
  const pic = f.retrato ? el("img", { class: "fc-pic", src: f.retrato, alt: "" }) : el("span", { class: "fc-pic", text: "👤" });
  return el("article", { class: "fc" },
    el("div", { class: "fc-head" }, pic,
      el("div", {}, el("h3", { text: f.nome || "Sem nome" }), el("div", { class: "fc-meta", text: (f.dom && f.dom.nome) || "Sem dom" }))),
    el("div", { class: "fc-foot" },
      el("span", { text: "Atualizada em " + (fmtData(f.updatedAt) || "—") }),
      el("div", { class: "fc-btns" }, el("a", { class: "btn mini", href: "ficha.html?id=" + encodeURIComponent(f.id), text: "👁️ Abrir" }))));
}

function desenhar() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const filtradas = fichas.filter((f) => !q || [f.nome, f.dom && f.dom.nome, f.ownerName].some((x) => String(x || "").toLowerCase().includes(q)));
  lista.className = ""; lista.textContent = "";
  if (!filtradas.length) {
    lista.append(el("div", { class: "empty" }, el("div", { class: "big", text: "⚔" }),
      el("p", { text: fichas.length ? "Nenhuma ficha encontrada para essa busca." : "Nenhum jogador criou ficha ainda." })));
    return;
  }
  const porDono = {};
  filtradas.forEach((f) => (porDono[f.ownerUid] = porDono[f.ownerUid] || []).push(f));
  Object.keys(porDono)
    .sort((a, b) => String(nomeDe(a, porDono[a])).localeCompare(String(nomeDe(b, porDono[b])), "pt-BR"))
    .forEach((uid) => {
      const fs = porDono[uid];
      const u = usuarios[uid] || {};
      const grid = el("div", { class: "cards" });
      fs.forEach((f) => grid.append(card(f)));
      lista.append(el("section", { class: "group" },
        el("div", { class: "group-head" }, avatarNode(u, "avatar-mini"), el("h3", { text: nomeDe(uid, fs) }),
          el("span", { class: "count", text: fs.length + (fs.length === 1 ? " ficha" : " fichas") })),
        grid));
    });
}
function nomeDe(uid, fs) { return (usuarios[uid] && usuarios[uid].name) || (fs[0] && fs[0].ownerName) || "Jogador"; }

try {
  const [fs, us] = await Promise.all([getDocs(collection(db, "fichas")), getDocs(collection(db, "users"))]);
  us.forEach((d) => (usuarios[d.id] = d.data()));
  fichas = fs.docs.map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => ((b.updatedAt && b.updatedAt.seconds) || 0) - ((a.updatedAt && a.updatedAt.seconds) || 0));
  desenhar();
} catch (e) {
  lista.className = ""; lista.textContent = "";
  lista.append(el("div", { class: "msg", text: "Erro ao carregar (" + (e.code || e.message) + "). Confira se as regras do Firestore foram atualizadas." }));
}
document.getElementById("busca").addEventListener("input", desenhar);
</script>
</body>
</html>
