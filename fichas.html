<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>try{var l=JSON.parse(localStorage.getItem('nh-leitura')||'{}');if(l.t)document.documentElement.dataset.tema=l.t;if(l.s)document.documentElement.style.fontSize=l.s+'%'}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Fichas | Never Heroes</title>
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/svg+xml" href="images/icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="images/icon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/topbar.css">
<link rel="stylesheet" href="css/refino.css">
</head>
<body>
<header id="topbar"></header>

<main class="shell wide">
  <div class="page-head">
    <div class="eyebrow">Seus personagens</div>
    <h1>Minhas Fichas</h1>
    <p>Todas as fichas que você criou. Você pode ter mais de um personagem.</p>
  </div>

  <div class="toolbar">
    <button type="button" class="btn" id="btnNova">+ Criar nova ficha</button>
  </div>
  <div id="erro"></div>
  <div id="lista" class="center">Carregando fichas…</div>
</main>

<script type="module">
import { db, guard, renderTopbar, el, fmtData, avatarNode, domThumb } from "./js/fb.js";
import { nomesDoms } from "./js/ficha-shared.js";
import { collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const { user, profile } = await guard();
renderTopbar(profile, "fichas", "Minhas fichas");

const lista = document.getElementById("lista");

function card(f) {
  const pic = f.retrato ? el("img", { class: "fc-pic", loading: "lazy", src: f.retrato, alt: "" }) : avatarNode({}, "fc-pic");
  const doms = nomesDoms(f);
  const dom = doms.length ? doms.join(", ") : "Sem dom";
  return el("article", { class: "fc" },
    el("div", { class: "fc-head" }, pic,
      el("div", {}, el("h3", { text: f.nome || "Sem nome" }), el("div", { class: "fc-meta", text: dom }), doms.length > 1 ? el("span", { class: "fc-more", text: doms.length + " doms" }) : null),
      domThumb(f)),
    el("div", { class: "fc-foot" },
      el("span", { text: "Atualizada em " + (fmtData(f.updatedAt) || "—") }),
      el("div", { class: "fc-btns" }, el("a", { class: "btn mini sec", href: "ficha-view.html?id=" + encodeURIComponent(f.id), text: "Ver" }), el("a", { class: "btn mini", href: "ficha-editor.html?id=" + encodeURIComponent(f.id), text: "Editar" }))));
}

async function carregar() {
  try {
    const snap = await getDocs(query(collection(db, "fichas"), where("ownerUid", "==", user.uid)));
    const fichas = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => ((b.updatedAt && b.updatedAt.seconds) || 0) - ((a.updatedAt && a.updatedAt.seconds) || 0));
    lista.className = "";
    lista.textContent = "";
    if (!fichas.length) {
      lista.append(el("div", { class: "empty" }, el("div", { class: "big", text: "✦" }),
        el("p", { text: "Você ainda não tem nenhuma ficha." }),
        el("p", { text: "Use o botão “Criar nova ficha” para começar sua jornada." })));
      return;
    }
    const grid = el("div", { class: "cards" });
    fichas.forEach((f) => grid.append(card(f)));
    lista.append(grid);
  } catch (e) {
    lista.className = "";
    lista.textContent = "";
    lista.append(el("div", { class: "msg", text: "Erro ao carregar as fichas (" + (e.code || e.message) + ")." }));
  }
}

document.getElementById("btnNova").addEventListener("click", async (ev) => {
  const b = ev.currentTarget; b.disabled = true;
  try {
    const ref = await addDoc(collection(db, "fichas"), {
      nome: "Sem nome",
      info: { nome: "", idade: "", altura: "", fama: 0, hp: "", money: 0, sanidade: 100 },
      dom: { nome: "", categorias: "", edom: 100, edomMax: 100 }, domsExtra: [],
      status: { sorte: "", vontade: "", foco: "", destreza: "", forca: "", agilidade: "", intelecto: "", constituicao: "", carisma: "", instintos: "" },
      inventario: [],
      habilidades: [], passivas: [], aparencia: "", retrato: "",
      ownerUid: user.uid, ownerName: profile.name || "", updatedAt: serverTimestamp()
    });
    location.href = "ficha-editor.html?id=" + encodeURIComponent(ref.id);
  } catch (e) {
    document.getElementById("erro").replaceChildren(el("div", { class: "msg", text: "Não foi possível criar a ficha (" + (e.code || e.message) + ")." }));
    b.disabled = false;
  }
});

carregar();
</script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
